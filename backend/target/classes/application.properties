server.port=8080
spring.application.name=attendance-system

spring.datasource.url=jdbc:mysql://mysql-1ced875f-mdf653015-a793.l.aivencloud.com:25424/defaultdb?sslMode=REQUIRED
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

app.admin.username=${ADMIN_USER}
app.admin.password=${ADMIN_PASS}

spring.jackson.serialization.write-dates-as-timestamps=false